theme:
  name: material
  language: en
  favicon: assets/img/l_white.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.expand
    - navigation.instant
    - toc.integrate
    - navigation.instant.prefetch
    - navigation.instant.progress
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tabs.linked
    - header.autohide
    - announce.dismiss

  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    
  logo: assets/img/lectron_white.svg


plugins:
  - search
  - drawio
  - optimize

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true    # tab’li içerik
  - pymdownx.tasklist:
      custom_checkbox: true    # [ ] / [x] checklist
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
